version: '3.8'

services:
  # 1. FRONTEND (Next.js App)
  umt-techgen-web:
    build: .
    container_name: umt-techgen-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://techgen.umt.edu.vn/api

  # 2. NGINX (Web Server & SSL)
  nginx:
    image: nginx:stable
    container_name: umt-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # LƯU Ý: Đường dẫn này dựa trên log PM2 bạn gửi. Hãy kiểm tra kỹ.
      # Cấu trúc: [Đường dẫn thật trên VPS]:[Đường dẫn giả lập trong Nginx]
      - /home/sotubuadm/web-techgen/umt-backend/uploads:/var/www/uploads
    extra_hosts:
      # Dòng này giúp Nginx trong Docker gọi được Backend (PM2) ở ngoài qua: http://host.docker.internal:4000
      - "host.docker.internal:host-gateway"
    depends_on:
      - umt-techgen-web

  # 3. CERTBOT (Auto SSL)
  certbot:
    image: certbot/certbot
    container_name: umt-certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Script giữ container luôn chạy và check gia hạn mỗi 12h
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"